# Planelands browser release (tools/build_web.py -> tools/deploy_web.sh): static files only, every
# visitor runs the simulator in their own browser.
#   http://<server>:8090/            direct (open 8090/tcp in the firewall)
#   https://planelands.ftmine.cn/    once that DNS record exists (Cloudflare -> 443 xray -> 8444 here)
# Install: /etc/nginx/sites-available/planelands.conf, linked from sites-enabled.

server {
    listen 8090;
    listen [::]:8090;
    server_name _;
    include /etc/nginx/snippets/planelands-site.conf;
}

server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    server_name planelands.ftmine.cn;
    ssl_certificate     /etc/nginx/ssl/api.ftmine.cn.pem;   # Cloudflare Origin CA, *.ftmine.cn
    ssl_certificate_key /etc/nginx/ssl/api.ftmine.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    include /etc/nginx/snippets/planelands-site.conf;
}
