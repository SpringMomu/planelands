# Planelands browser release (tools/build_web.py -> tools/deploy_web.py): static files only, every
# visitor runs the simulator in their own browser.
#   https://spaceshuttle.ftmine.cn/   Cloudflare (SSL Full strict) -> 443 xray (REALITY, dest 127.0.0.1:8444,
#                                     PROXY protocol) -> this server block, Cloudflare Origin CA cert *.ftmine.cn
#   http://<server>:8090/             old address: redirects to the domain
# Install: /etc/nginx/sites-available/planelands.conf, linked from sites-enabled; the shared part is
# /etc/nginx/snippets/planelands-site.conf.  Daily visitor counts: deploy/planelands-visits.py.

# The TCP peer behind the PROXY protocol is a Cloudflare edge; the visitor is in CF-Connecting-IP,
# trusted only when the peer really is Cloudflare (https://www.cloudflare.com/ips/).
geo $remote_addr $planelands_via_cf {
    default 0;
    173.245.48.0/20 1; 103.21.244.0/22 1; 103.22.200.0/22 1; 103.31.4.0/22 1;
    141.101.64.0/18 1; 108.162.192.0/18 1; 190.93.240.0/20 1; 188.114.96.0/20 1;
    197.234.240.0/22 1; 198.41.128.0/17 1; 162.158.0.0/15 1; 104.16.0.0/13 1;
    104.24.0.0/14 1; 172.64.0.0/13 1; 131.0.72.0/22 1;
    2400:cb00::/32 1; 2606:4700::/32 1; 2803:f800::/32 1; 2405:b500::/32 1;
    2405:8100::/32 1; 2a06:98c0::/29 1; 2c0f:f248::/32 1;
}
map "$planelands_via_cf:$http_cf_connecting_ip" $planelands_client {
    default $remote_addr;
    "~^1:(?<planelands_cfip>.+)$" $planelands_cfip;
}
# access log: visitor IP, time, request, status, bytes, referrer, user agent, country (Cloudflare)
log_format planelands '$planelands_client [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" "$http_cf_ipcountry"';

server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    server_name spaceshuttle.ftmine.cn planelands.ftmine.cn;
    ssl_certificate     /etc/nginx/ssl/api.ftmine.cn.pem;   # Cloudflare Origin CA, *.ftmine.cn
    ssl_certificate_key /etc/nginx/ssl/api.ftmine.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    include /etc/nginx/snippets/planelands-site.conf;
}

# plain http (Cloudflare without "Always Use HTTPS") and the old ip:port address -> https + domain
server {
    listen 80;
    listen [::]:80;
    server_name spaceshuttle.ftmine.cn planelands.ftmine.cn;
    server_tokens off;
    return 301 https://spaceshuttle.ftmine.cn$request_uri;
}
server {
    listen 8090;
    listen [::]:8090;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/planelands.access.log planelands;
    return 301 https://spaceshuttle.ftmine.cn$request_uri;
}
