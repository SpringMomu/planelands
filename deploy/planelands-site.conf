# the planelands site (installed as /etc/nginx/snippets/planelands-site.conf, included by planelands.conf)
root /var/www/planelands;
index index.html;
server_tokens off;
access_log /var/log/nginx/planelands.access.log planelands;   # format in planelands.conf (visitor IP)
error_log  /var/log/nginx/planelands.error.log;

# precompressed .gz siblings from the build; on-the-fly gzip for anything else
gzip_static on;
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/json application/wasm
           application/octet-stream image/svg+xml;
gzip_vary on;

types {
    text/html                 html;
    text/css                  css;
    text/javascript           js mjs;
    application/json          json;
    application/wasm          wasm;
    application/zip           zip whl;
    image/svg+xml             svg;
    image/png                 png;
    application/octet-stream  f32 plh u8 bin;
}
default_type application/octet-stream;

add_header X-Content-Type-Options nosniff always;

# releases, content-addressed data and the Pyodide runtime never change once published
location ~ ^/(v|d|pyodide)/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# entry points: always revalidated (ETag -> 304), so a deploy is picked up on the next visit
location = /version.json {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ =404;
}
